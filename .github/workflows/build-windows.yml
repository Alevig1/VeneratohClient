name: Build Veneratoh Client (Windows)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      - uses: Swatinem/rust-cache@v2

      - name: Build
        shell: pwsh
        run: cargo build --release -p oneclient_app

      - uses: actions/upload-artifact@v4
        with:
          name: VeneratohClient-windows
          path: target/release/oneclient_app.exe
